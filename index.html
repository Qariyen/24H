<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>24 — Plan your day</title>
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="24">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
:root{--bg:#0b0b0d;--ink:#f2f2f3;--dim:#7a7d86;--line:#26282e;--H:24px;--PH:600px;--green:#2dff7a}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:2;max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 10px);opacity:0;transform:scale(.97) translate3d(0,12px,0)}
body.go main{opacity:1;transform:none;transition:opacity .7s,transform .9s cubic-bezier(.2,.9,.2,1)}
header{flex:none;display:flex;justify-content:space-between;align-items:flex-start}
.t1{font-size:10px;letter-spacing:.3em;font-weight:600;color:var(--dim)}
.dn{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:18px;font-weight:650;letter-spacing:-.02em;white-space:nowrap}
.dn button{width:28px;height:28px;border-radius:50%;font-size:16px;color:var(--dim);background:transparent;border:1px solid var(--line);cursor:pointer;line-height:1}
#clock{text-align:right;font-size:20px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
#clock small{display:block;font-size:11px;font-weight:600;color:#ff6b5e;letter-spacing:0;margin-top:5px}
#quote{flex:none;margin:10px 0 8px;padding:0 0 0 10px;border:0;border-left:2px solid #ff4d4d;background:none;text-align:left;font:inherit;font-size:12.5px;line-height:1.35;color:#c9cbd1;cursor:pointer;width:100%;transition:opacity .3s;min-height:34px;display:flex;align-items:center}
#quote.sw{opacity:0}
#stage{flex:1;min-height:0;position:relative;margin-left:24px}
#pill{position:absolute;left:0;top:0;width:92px;height:var(--PH);border-radius:46px;padding:6px 0;border:1.5px solid #34363d;background:var(--bg);z-index:2}
#pill.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.row{height:var(--H);display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums;color:#d9dbe0;cursor:pointer;user-select:none;position:relative;opacity:0;transform:translateY(8px)}
body.go .row{animation:rin .9s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:calc(var(--i)*105ms + 500ms)}
@keyframes rin{to{opacity:1;transform:none}}
.row::before{content:"";position:absolute;inset:1px 10px;border-radius:12px;transition:background .15s;z-index:-1}
@media(hover:hover){.row:hover::before{background:#17181c}}
.row .t{position:relative}
.row.crossed .t{color:#55585f}
.row.crossed .t::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:2px;background:#ff4d4d;transform:rotate(-8deg);transform-origin:left;animation:str .35s}
@keyframes str{from{transform:rotate(-8deg) scaleX(0)}}
body.cross .row{cursor:crosshair}
#arrow{position:absolute;left:-20px;top:0;will-change:transform;width:16px;height:16px;margin-top:-8px;z-index:6;pointer-events:none;opacity:0}
#arrow svg{width:16px;height:16px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(3px)}}
#nowline{position:absolute;left:0;width:92px;top:0;will-change:transform;height:1.5px;margin-top:-.75px;z-index:5;pointer-events:none;background:var(--green);opacity:0}
#arrow.show,#nowline.show{opacity:1}
#arrow.sm,#nowline.sm{transition:transform .9s linear,opacity .5s}
body:not(.go) #arrow,body:not(.go) #nowline{opacity:0!important}
#arrowT{position:absolute;left:-7px;top:15px;font-size:9px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
#notes{position:absolute;left:104px;right:0;top:6px;height:calc(var(--H)*24);z-index:3;transition:opacity .18s}
.blk{position:absolute;left:0;right:0;display:flex;align-items:stretch;animation:bin .6s cubic-bezier(.2,1.3,.3,1) both;transition:top .12s ease-out,height .12s ease-out}
@keyframes bin{from{opacity:0;transform:translateX(-14px)}}
.blk.drag{transition:none;z-index:8}
.blk.out{animation:bout .3s forwards}
@keyframes bout{to{opacity:0;transform:translateX(20px)}}
.blk svg{flex:0 0 22px;width:22px;height:100%;overflow:visible;cursor:grab;touch-action:none;position:relative}
.blk svg:active{cursor:grabbing}
.blk path{fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-out forwards;animation-delay:inherit}
@keyframes draw{to{stroke-dashoffset:0}}
.blk .lab{flex:1;display:flex;align-items:center;padding-left:5px;min-width:0}
.blk .lab span{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;font-size:14px;font-weight:600;line-height:1.1;color:var(--c);outline:0;min-width:30px;max-width:100%;overflow-wrap:anywhere;cursor:text}
.blk .lab span:empty::before{content:"write here";opacity:.4}
.blk.done .lab span{opacity:.4;text-decoration:line-through;text-decoration-thickness:2px}
.tg{font-style:normal;position:absolute;left:25px;font-size:9px;font-weight:700;color:var(--c);opacity:.85;font-variant-numeric:tabular-nums;pointer-events:none;background:var(--bg);padding:0 3px;border-radius:4px;display:none;line-height:1.3}
.tg.s{top:-6px}.tg.e{bottom:-6px}
.blk.t-s .tg.s,.blk.t-e .tg.e,.blk.drag .tg{display:block}
.blk .x{position:absolute;right:0;top:-2px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bg);color:var(--dim);font-size:15px;cursor:pointer;opacity:0;transition:opacity .15s;z-index:4}
.blk.sel .x{opacity:1}
.hd{position:absolute;left:-4px;width:11px;height:11px;border-radius:50%;background:var(--c);cursor:ns-resize;touch-action:none;opacity:0;z-index:3}
.hd::after{content:"";position:absolute;inset:-12px}
.hd.t{top:-5px}.hd.b{bottom:-5px}
.blk.sel .hd{opacity:1}
@media(hover:hover){.blk:hover .hd{opacity:1}}
#ghost{position:absolute;left:104px;right:0;border-radius:6px;border:1.5px dashed #5a5d66;display:none;pointer-events:none;z-index:4}
#bar{flex:none;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 6px 6px 14px;background:#141518;border:1px solid var(--line);border-radius:999px;min-height:46px;opacity:0;transition:opacity .6s 2s}
body.go #bar{opacity:1}
#sleep{font-size:12px;font-weight:700;white-space:nowrap;color:#6ea8ff}
#sleep.none{color:#ff6b5e}
#mid{flex:1;min-width:0;display:flex;justify-content:center;align-items:center}
#hintTxt{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cols{display:none;gap:11px}
#cols.open{display:flex}
#cols b{width:22px;height:22px;border-radius:50%;background:var(--c);cursor:pointer}
#cols b.on{box-shadow:0 0 0 2px #141518,0 0 0 3.5px #fff}
#crossBtn{font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:#22242a;border:0;border-radius:999px;padding:9px 13px;cursor:pointer;white-space:nowrap}
#crossBtn.on{background:#ff4d4d;color:#fff}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-70px);background:#ff4d4d;color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;z-index:150;transition:transform .4s cubic-bezier(.2,1.4,.3,1)}
#toast.show{transform:translate(-50%,0)}
/* ---------- intro: a countdown, a verdict, then the day opens ---------- */
#intro{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;padding:28px;cursor:pointer;transition:opacity .7s .5s}
#intro.done{opacity:0;pointer-events:none}
#intro.gone{display:none}
.iw{max-width:380px;width:100%}
.il{opacity:0;transform:translate3d(0,14px,0)}
.il.show{opacity:1;transform:none;transition:opacity 1s,transform 1.1s cubic-bezier(.2,.8,.2,1)}
#i1{font-size:13px;letter-spacing:.3em;font-weight:600;color:#7a7d86}

#secs{font-size:min(17vw,76px);font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:10px 0 2px;line-height:1}
#i3{font-size:15px;color:#7a7d86}
#iq{font-size:21px;line-height:1.3;font-weight:600;margin-top:36px;color:#f2f2f3}
#iq::before{content:"";display:block;width:26px;height:3px;background:#ff4d4d;margin-bottom:16px}
#skip{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:11px;letter-spacing:.3em;color:#3a3c42}
#ibar{position:absolute;left:0;bottom:0;height:3px;width:0;background:#ff4d4d}
.collapse .iw{animation:coll .6s cubic-bezier(.7,0,.3,1) forwards}
@keyframes coll{to{opacity:0;transform:scale(.95)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
<div id="intro"><div class="iw">
  <div class="il" id="i1">TODAY</div>
  <div class="il" id="secs">86,400</div>
  <div class="il" id="i3">seconds. That is all you get. Some are already gone.</div>
  <div class="il" id="iq"></div>
</div><div id="skip">TAP TO SKIP</div><div id="ibar"></div></div>
<canvas id="bg"></canvas>
<main>
  <header><div><div class="t1">PLAN</div><div class="dn"><button id="prev" aria-label="previous day">‹</button><span id="date"></span><button id="next" aria-label="next day">›</button></div></div><div id="clock">--:--<small id="left"></small></div></header>
  <button id="quote"></button>
  <section id="stage">
    <div id="pill"></div><div id="nowline"></div>
    <div id="arrow"><svg viewBox="0 0 16 16"><path d="M1 1 L15 8 L1 15 L4 8 Z" fill="#2dff7a"/></svg><b id="arrowT"></b></div>
    <div id="notes"></div><div id="ghost"></div>
  </section>
  <div id="bar"><span id="sleep">Sleep –</span><div id="mid"><span id="hintTxt">Tap an hour to plan</span><div id="cols"></div></div><button id="crossBtn">Cross out</button></div>
</main>
<div id="toast"></div>
<script>
(()=>{
const COLORS=['#ff6b5e','#6ea8ff','#ff7ad9','#4be08c','#ffd23f','#52d9ff'];
const $=s=>document.querySelector(s), pill=$('#pill'), notes=$('#notes'), stage=$('#stage'), root=document.documentElement;
const pad=n=>String(n).padStart(2,'0'), hh=h=>pad(h)+':00', fmt=sl=>pad(Math.floor(sl/2))+':'+(sl%2?'30':'00');
let H=24, SL=12, PADV=6;

/* ---------- quotes (sleep first) ---------- */
const SLEEP=[
"A day goes really fast. Don't spend the best of it tired.","Sleep takes a lot more of your day than you think. Plan it first.","Poor sleep costs you more time than sleep does. Sleep now.",
"A bad night steals tomorrow's hours. Go to bed.","Sleep is the most important thing on this list.","Everything you plan tomorrow depends on tonight's sleep.",
"You can't out-work a tired brain.","Tired you does half the work in twice the time. Sleep.","Eight hours isn't a waste. It's the price of the other sixteen.",
"Scrolling at 1 a.m. is borrowing from tomorrow, with interest.","A day goes fast. A bad night makes it go faster.","Sleep now, or pay for it all day tomorrow.",
"Poor sleep makes every hour slower and every task longer.","Protect your sleep like it's your job. It is.","Your best ideas won't survive a 3 a.m. bedtime.",
"The phone can wait. Your sleep can't."];
const HARSH=[
"Nobody is coming to save you.","You're not tired. You're undisciplined.","Motivation is a mood. Discipline is a decision.",
"Every hour you waste, someone else is using.","The clock doesn't care how you feel.","Comfort is the slow death of ambition.",
"Your future self is watching what you do tonight.","Excuses sound best to the person making them.","You will never feel like it. Do it anyway.",
"Today's laziness is tomorrow's regret.","Nobody cares. Work harder.","You are one decision away from a completely different life. Make it.",
"Stop planning. Start.","The person you want to be is doing what you're avoiding.","Being busy is not the same as being productive.",
"You can rest when you're done. Not before.","Average is a choice. So is excellence.","You say you want it. Your schedule says otherwise.",
"Hard now. Easy later. Easy now. Hard later.","Regret weighs more than effort.","You don't need more time. You need less excuse.",
"No one is impressed by your intentions.","The version of you that quits is the one you'll meet at 40.","You're not behind. You're just not moving.",
"Do it tired. Do it scared. Do it anyway.","Your phone is winning. Take your day back.","A plan you don't follow is a wish.",
"Stop negotiating with yourself.","Lost time is never found again. — Benjamin Franklin","You have power over your mind, not outside events. — Marcus Aurelius"];
const night=()=>{const h=new Date().getHours();return h>=21||h<5};
const pool=()=>night()?SLEEP:[...SLEEP,...HARSH,...SLEEP.slice(0,8)];
const dayNum=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
let qi=dayNum(); const qEl=$('#quote'); const showQ=()=>{const p=pool(); qEl.textContent=p[((qi%p.length)+p.length)%p.length]};
qEl.onclick=()=>{qEl.classList.add('sw'); qi+=1+Math.floor(Math.random()*6); setTimeout(()=>{showQ();qEl.classList.remove('sw')},180)}; showQ();

/* ---------- state: blocks in half-hour slots {s,e} (e exclusive, 0..48) ---------- */
const dayKey=d=>'day24c-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
let view=new Date(); view.setHours(12,0,0,0); let blocks=[], crossed=[];
function load(){ blocks=[];crossed=[]; try{const o=JSON.parse(localStorage.getItem(dayKey(view))||'{}'); crossed=o.crossed||[];
  blocks=(o.blocks||[]).map(b=>b.s!==undefined?b:{id:b.id,s:b.a*2,e:(b.b+1)*2,text:b.text,color:b.color,done:b.done});}catch(e){} }
let pt=0; const flush=()=>{clearTimeout(pt);pt=0;try{localStorage.setItem(dayKey(view),JSON.stringify({blocks,crossed}))}catch(e){}};
const persist=()=>{sleepChip();clearTimeout(pt);pt=setTimeout(flush,250)};
addEventListener('pagehide',flush); document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
const isToday=()=>dayKey(view)===dayKey(new Date());
function dateLabel(){ const t=new Date();t.setHours(12,0,0,0); const diff=Math.round((view-t)/864e5);
  const nm=diff===0?'Today':diff===1?'Tomorrow':diff===-1?'Yesterday':view.toLocaleDateString(undefined,{weekday:'short'});
  $('#date').textContent=nm+' · '+view.toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
const rows=[];
for(let i=0;i<24;i++){ const r=document.createElement('div'); r.className='row'; r.style.setProperty('--i',i); r.dataset.h=i; r.innerHTML='<span class="t">'+hh(i)+'</span>'; pill.appendChild(r); rows.push(r); }
const paintCross=()=>rows.forEach((r,i)=>r.classList.toggle('crossed',crossed.includes(i)));
function sleepChip(){ const re=/sleep|søvn|sov|bed\b|natt|night|nap/i; const sl=blocks.filter(b=>re.test(b.text)).reduce((a,b)=>a+(b.e-b.s)*30,0); const el=$('#sleep');
  el.classList.toggle('none',!sl); el.textContent=sl?('Sleep '+Math.floor(sl/60)+'h'+(sl%60?' '+sl%60+'m':'')):'No sleep!'; }

/* ---------- fit to screen ---------- */
let lastSH=0; function measure(){ const h=stage.clientHeight; if(Math.abs(h-lastSH)<1&&lastSH)return; lastSH=h; H=Math.max(16,Math.min(50,(h-12)/24)); SL=H/2; root.style.setProperty('--H',H+'px'); root.style.setProperty('--PH',(24*H+12)+'px'); blocks.forEach(b=>{const el=elOf(b); if(el)layout(b,el)}); tick(); }

/* ---------- real-time arrow + seconds ---------- */
function tick(){
  const d=new Date(), h=d.getHours(), m=d.getMinutes(), y=PADV+(h+m/60)*H;
  $('#clock').firstChild.textContent=pad(h)+':'+pad(m);
  for(const id of ['#arrow','#nowline']){ const el=$(id); el.style.transform='translate3d(0,'+y+'px,0)'; el.classList.toggle('show',isToday()); if(!el.dataset.i){el.dataset.i=1;setTimeout(()=>el.classList.add('sm'),60)} }
  $('#arrowT').textContent=pad(h)+':'+pad(m);
}
function secs(){ const n=new Date(),e=new Date(n);e.setHours(24,0,0,0); $('#left').textContent=Math.max(0,Math.floor((e-n)/1000)).toLocaleString('en-US')+' s left'; }
secs(); setInterval(secs,1000); setInterval(tick,10000);

/* ---------- braces ---------- */
const free=(s,e,ign)=>!blocks.some(x=>x!==ign&&!(e<=x.s||s>=x.e));
const rel=y=>(y-notes.getBoundingClientRect().top)/SL;               // slot units (float)
const slotAt=y=>Math.max(0,Math.min(47,Math.floor(rel(y))));
const edgeAt=y=>Math.max(0,Math.min(48,Math.round(rel(y))));
function bracket(h){ const m=h/2, r=Math.max(1,Math.min(9,h/4)); return 'M1 1 Q11 1 11 '+(1+r)+' L11 '+(m-r)+' Q11 '+m+' 21 '+m+' Q11 '+m+' 11 '+(m+r)+' L11 '+(h-1-r)+' Q11 '+(h-1)+' 1 '+(h-1); }
function tags(b,el){ el.classList.toggle('t-s',b.s%2===1); el.classList.toggle('t-e',b.e%2===1); el.querySelector('.tg.s').textContent=fmt(b.s); el.querySelector('.tg.e').textContent=fmt(b.e); }
function layout(b,el){ const h=(b.e-b.s)*SL; el.style.top=(b.s*SL)+'px'; el.style.height=h+'px'; el.querySelector('path').setAttribute('d',bracket(h)); el.querySelector('svg').setAttribute('viewBox','0 0 22 '+h); tags(b,el); }
function build(b,delay){
  const el=document.createElement('div'); el.className='blk'+(b.done?' done':''); el.dataset.id=b.id; el.style.setProperty('--c',b.color);
  el.innerHTML='<svg viewBox="0 0 22 24"><path pathLength="1" d=""/></svg><div class="lab"><span contenteditable="true" spellcheck="false"></span></div><button class="x" aria-label="remove">×</button><i class="hd t"></i><i class="hd b"></i><i class="tg s"></i><i class="tg e"></i>';
  el.querySelector('span').textContent=b.text;
  if(delay===false){el.style.animation='none';const p=el.querySelector('path');p.style.animation='none';p.style.strokeDashoffset=0;}
  else if(delay>0){ el.style.animationDelay=delay+'ms'; }
  notes.appendChild(el); layout(b,el); return el;
}
const render=anim=>{notes.innerHTML='';blocks.forEach(b=>build(b,anim?(600+(b.s/2)*105):false))};
const elOf=b=>notes.querySelector('[data-id="'+b.id+'"]');
let selected=null; const cols=$('#cols'); cols.innerHTML=COLORS.map(c=>'<b style="--c:'+c+'" data-c="'+c+'"></b>').join('');
function select(b){ selected=b; notes.querySelectorAll('.blk').forEach(e=>e.classList.toggle('sel',!!b&&e.dataset.id==b.id));
  cols.classList.toggle('open',!!b); $('#hintTxt').style.display=b?'none':''; if(b)cols.querySelectorAll('b').forEach(x=>x.classList.toggle('on',x.dataset.c===b.color)); }
cols.addEventListener('pointerdown',e=>{e.preventDefault()});
cols.addEventListener('click',e=>{const c=e.target.dataset.c; if(!c||!selected)return; selected.color=c; persist(); elOf(selected).style.setProperty('--c',c); select(selected)});
notes.addEventListener('input',e=>{const el=e.target.closest('.blk'); if(!el)return; blocks.find(x=>x.id==el.dataset.id).text=e.target.textContent; persist()});
notes.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();e.target.blur()} });
notes.addEventListener('focusin',e=>{const el=e.target.closest('.blk'); if(el)select(blocks.find(x=>x.id==el.dataset.id))});
notes.addEventListener('click',e=>{ const el=e.target.closest('.blk'); if(!el||!e.target.classList.contains('x'))return; const b=blocks.find(x=>x.id==el.dataset.id);
  el.classList.add('out'); select(null); setTimeout(()=>{blocks=blocks.filter(x=>x!==b);persist();render(false)},300); });
notes.addEventListener('dblclick',e=>{const el=e.target.closest('.blk'); if(!el||e.target.closest('.lab'))return; const b=blocks.find(x=>x.id==el.dataset.id); b.done=!b.done; persist(); el.classList.toggle('done',b.done)});

/* drag: move / resize / create (all snap to :00 / :30) */
let op=null, cr=null; const ghost=$('#ghost');
function startOp(e,kind,b){ e.preventDefault(); e.stopPropagation(); const el=elOf(b); el.classList.add('drag'); select(b); op={kind,b,el,off:rel(e.clientY)-b.s,len:b.e-b.s}; }
notes.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.blk'); if(!el)return; const b=blocks.find(x=>x.id==el.dataset.id);
  if(e.target.classList.contains('hd')) startOp(e,e.target.classList.contains('t')?'top':'bot',b);
  else if(e.target.closest('svg')) startOp(e,'move',b);
});
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(5)}catch(e){}};
const tryApply=(b,s2,e2)=>{ if(s2<0||e2>48||e2<=s2||!free(s2,e2,b))return false; if(b.s!==s2||b.e!==e2)buzz(); b.s=s2;b.e=e2; return true };
let pend=null, raf=0;
function onMove(e){
  if(op){ const b=op.b;
    if(op.kind==='move'){ const s2=Math.round(rel(e.clientY)-op.off); tryApply(b,s2,s2+op.len); }
    else if(op.kind==='top') tryApply(b,Math.min(edgeAt(e.clientY),b.e-1),b.e); else tryApply(b,b.s,Math.max(edgeAt(e.clientY),b.s+1));
    layout(b,op.el); return; }

function down(e){

function create(s,e){

{

{
